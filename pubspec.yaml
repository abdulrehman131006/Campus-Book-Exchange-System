name: campus_book_exchange
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.1
  firebase_auth: ^5.3.4
  firebase_database: ^11.1.5
  provider: ^6.1.5+1
  google_generative_ai: ^0.4.7
  email_otp: ^3.2.0
  http: ^1.6.0
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  image_picker: ^1.1.2
  firebase_storage: ^12.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.jpg"
  min_sdk_android: 21